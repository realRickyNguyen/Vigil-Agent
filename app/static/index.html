// On the landing page and below 1100px the sidebar is a panel the "Investigations" button opens over the page; wider, on an
// investigation, it is always shown and this does nothing. Clicking the dimmed page or pressing Escape closes the panel.
function setSide(open) {
  const side = $("#sidebar"), scrim = $("#scrim"), was = document.body.classList.contains("floating");
  // Closing an open panel rolls it up first (unless motion is reduced), then closes it for real.
  if (!open && was && !side.classList.contains("closing") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    side.classList.add("closing");
    scrim.classList.add("closing");
    $("#side-toggle").setAttribute("aria-expanded", "false");
    // When the roll-up ends, or after its length if the page draws no frames (a hidden tab), whichever comes first.
    const done = () => { if (side.classList.contains("closing")) setSide(false); };
    side.addEventListener("animationend", done, {once: true});
    setTimeout(done, 320);
    return;
  }
  side.classList.remove("closing");
  scrim.classList.remove("closing");
  const floating = open && (document.body.classList.contains("landing") || matchMedia("(max-width: 1100px)").matches);
  $(".layout").classList.toggle("side-open", open);
  document.body.classList.toggle("floating", floating);
  // While it floats over the dimmed page it is a dialog; otherwise it is the page's sidebar.
  if (floating) { side.setAttribute("role", "dialog"); side.setAttribute("aria-modal", "true"); }
  else { side.removeAttribute("role"); side.removeAttribute("aria-modal"); }
  $("#side-toggle").setAttribute("aria-expanded", String(open));
  scrim.hidden = !floating;
  if (floating && !was) $("#side-close").focus();
}
// A click while the panel is rolling up opens it again.
$("#side-toggle").addEventListener("click", () => setSide(!$(".layout").classList.contains("side-open") || $("#sidebar").classList.contains("closing")));
$("#scrim").addEventListener("click", () => setSide(false));
$("#side-close").addEventListener("click", () => { setSide(false); $("#side-toggle").focus(); });
// The panel stops floating past 1100px on an investigation.
window.addEventListener("resize", () => { if ($(".layout").classList.contains("side-open")) setSide(true); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("#scrim").hidden) return;
  setSide(false);
  $("#side-toggle").focus();
});

$("#run-filter").addEventListener("input", (e) => { search = e.target.value.trim().toLowerCase(); drawRuns(); });
$("#runs").addEventListener("click", (e) => { const b = e.target.closest("button[data-run]"); if (b) openRun(b.dataset.run); });
function goHome() { clearTimeout(pollTimer); current = null; shown = null; drawRuns(); intro(); }
$("#home").addEventListener("click", (e) => { e.preventDefault(); history.replaceState(null, "", location.pathname); goHome(); });

// ---------- starting and following a run ----------
$("#run-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const drug = $("#drug").value.trim();
  if (!drug) return;
  $("#run-btn").disabled = true;
  const body = {input: {drug}, options: {wait: false}};
  if (sampleMode) body.options.sample_mode = true;
  const [status, out] = await api("/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  $("#run-btn").disabled = false;
  if (status !== 202) {
    if (["Busy", "InvalidInput", "NoSampleRecording"].includes(out.error?.type)) return toast(out.error.message);
    return showError(out, drug, status);
  }
  current = out.run_id;
  location.hash = current;
  setSide(false);
  follow(current, drug);
  loadRuns(); loadHealth();
});

function follow(runId, drug) {
  setLanding(false);
  clearTimeout(pollTimer);
  shown = null;
  // The clock counts from when the run started, not from when this page opened it, so it keeps its time when the
  // visitor looks at another run and comes back. A run ID without a time takes the first progress line's time instead.
  const fromId = runStart(runId);
  let started = fromId ?? Date.now();
  const clock = () => {
    const s = Math.max(0, Math.round((Date.now() - started) / 1000)), el = $("#elapsed");
    if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  // The clock ticks each second, apart from the 2-second progress polls; it stops when the page leaves this run's view.
  const ticker = setInterval(() => { if (current !== runId || !$("#elapsed")) return clearInterval(ticker); clock(); }, 1000);
  let after = 0;
  const seen = new Set();
  $("#main").innerHTML = `
    <header class="masthead"><div class="mast-row"><h1 class="title">${esc(drug || "Investigation")}</h1><span class="elapsed" title="Time since the run started"><span class="sq live"></span><b id="elapsed">0:00</b> elapsed</span></div>
      <div class="facts"><span><b id="run-state">In progress</b></span><span>Run <span class="mono">${esc(runId)}</span></span></div></header>
    <section class="stage" aria-label="Progress">
      <ol class="crew" id="crew"></ol>
      <p class="says" id="says" aria-hidden="true"></p>
    </section>
    <div class="section" style="margin-top:28px"><ol class="proc steps with-crew" id="stages"></ol></div>
    <div class="log" id="log" aria-live="polite"></div>`;
  // An agent is waiting until its first progress line, working while it wrote the latest one, and standing by otherwise:
  // never "done", as an agent can start again (the Reviewer re-checks after the Skeptic's challenge).
  const state = (k, active) => !seen.has(k) ? "pending" : k === active ? "active" : "idle";
  const STATE = {pending: "Waiting", active: "Working", idle: "Standing by"};
  let drawn = "";
  const drawStages = (active, says) => {
    drawSays(says);
    const key = `${active}|${[...seen].join()}`;
    if (key === drawn) return;
    drawn = key;
    $("#stages").innerHTML = STAGES.map(([k, name, what]) => {
      const s = state(k, active);
      return `<li class="${s}"><span class="who">${s === "active" ? working(k) : sprite(k)}${name}</span><span class="what">${what}</span><span class="st">${s === "active" ? `<span class="sq live"></span>` : ""}${STATE[s]}</span></li>`;
    }).join("");
    $("#crew").innerHTML = STAGES.map(([k, name]) => {
      const s = state(k, active);
      return `<li class="${s}"><span class="fig">${s === "active" ? working(k) : sprite(k)}</span><span class="nm">${name}</span><span class="st">${STATE[s]}</span></li>`;
    }).join("");
  };
  const drawSays = (says) => {
    // The agent's latest progress line, without the agent's name it starts with (the bubble gives it in bold).
    const line = says && says.line.startsWith(AGENT[says.agent] + " ") ? says.line.slice(AGENT[says.agent].length + 1) : says?.line;
    const el = $("#says");
    el.innerHTML = says ? `<b>${esc(AGENT[says.agent])}</b>${says.sample_mode ? "[replay] " : ""}${esc(line)}` : "Starting the run…";
    el.title = says ? `${AGENT[says.agent]}: ${says.line}` : "";
  };
  drawStages(null);
  // A replay comes back from the server in a few seconds. Its progress lines are played out here at a readable pace,
  // about 25 seconds in all, with how far the playback has got and a link to skip to the result. Every line shown is
  // the replay's own; only the pace is the page's. A live run's lines show as soon as they arrive.
  const queue = [];                                   // lines fetched but not shown yet
  // replay: the run is a replay; paced: its lines are played at a readable pace (until the visitor skips).
  let replay = false, paced = false, total = 0, done = 0, ended = null;  // ended: [HTTP status, body] once the run has finished
  const show = (batch) => {
    const log = $("#log");
    if (!log || !batch.length) return;
    const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
    log.insertAdjacentHTML("beforeend", batch.map((x) => `<div class="ln"><span class="t">${esc(clockTime(x.ts))}</span><span class="a">${sprite(x.agent)}${esc(AGENT[x.agent] || x.agent)}</span><span>${x.sample_mode ? "[replay] " : ""}${esc(x.line)}</span></div>`).join(""));
    if (stick) log.scrollTop = log.scrollHeight;
    let last = null, says = null;
    for (const x of batch) if (STAGES.some(([k]) => k === x.agent)) { seen.add(x.agent); last = x.agent; says = x; }
    if (last) drawStages(last, says);
    done += batch.length;
    const n = $("#replay-n");
    if (n) n.textContent = `${num(done)} of ${num(total)}`;
  };
  const finish = () => {
    loadRuns(); loadHealth();
    const [ss, st] = ended;
    if (st.status === "success") render(st);
    else showError(st, drug, ss);
  };
  const pump = setInterval(() => {
    if (current !== runId || !$("#log")) return clearInterval(pump);
    if (queue.length) show(queue.splice(0, paced ? Math.max(1, Math.ceil(total / 250)) : queue.length));
    if (!queue.length && ended) { clearInterval(pump); finish(); }
  }, 100);
  const markReplay = () => {
    replay = paced = true;
    $("#run-state").textContent = "Replaying a recorded run";
    $(".elapsed").outerHTML = `<span class="elapsed" title="Progress lines of the replay shown so far; the page plays them at a readable pace">
      <span class="sq live"></span><b id="replay-n">0 of 0</b> lines replayed <button type="button" class="link skip" id="skip">Skip to the result</button></span>`;
    $("#skip").onclick = () => { paced = false; show(queue.splice(0)); };  // the rest at once, and later lines as they come
  };
  const fetchLines = async () => {
    const [es, ev] = await api(`/runs/${encodeURIComponent(runId)}/events?after=${after}`);
    if (es !== 200) return;
    if (fromId == null && after === 0 && Date.parse(ev.events[0]?.ts)) { started = Date.parse(ev.events[0].ts); clock(); }
    after = ev.last_seq;
    if (!replay && ev.events.some((x) => x.sample_mode)) markReplay();
    queue.push(...ev.events);
    total += ev.events.length;
  };
  const tick = async () => {
    if (current !== runId) return;
    clock();
    await fetchLines();
    const [ss, st] = await api(`/runs/${encodeURIComponent(runId)}`);
    if (st.status === "running") { pollTimer = setTimeout(tick, replay ? 700 : 2000); return; }  // a replay is short: check often
    await fetchLines();  // any lines written between the two calls
    ended = [ss, st];    // the pump shows the result once every line is out
  };
  tick();
}

async function openRun(runId) {
  clearTimeout(pollTimer);
  current = runId;
  if (location.hash.slice(1) !== runId) location.hash = runId;
  setLanding(false);
  setSide(false);
  drawRuns();
  $("#main").innerHTML = `<p class="loading">Opening ${esc(runId)}…</p>`;
  const [status, out] = await api(`/runs/${encodeURIComponent(runId)}`);
  if (current !== runId) return;
  if (out.status === "running") return follow(runId, health?.current_run === runId ? capital(health.current_drug || "") || null : null);
  if (out.status === "success") return render(out);
  showError(out, null, status);
}

function showError(out, drug, status) {
  setLanding(false);
  shown = null;
  const e = out.error || {};
  $("#main").innerHTML = `
    <header class="masthead"><h1 class="title">${esc(drug || (e.type === "RunNotFound" ? "No such run" : "Run failed"))}</h1>
      ${drug ? `<div class="facts"><span><b>Investigation stopped</b></span></div>` : ""}</header>
    ${drug ? `<div class="stopped">${sprite("orchestrator", "concerned")}</div>` : ""}
    <p class="notice error"><b>${esc(e.type || "Error")}</b>${status ? ` (HTTP ${esc(status)})` : ""}: ${esc(e.message || "The run failed.")}
    ${e.recoverable ? "<br>This can be retried once the service is back." : ""}
    ${out.log_file ? `<br><span class="muted">Trace: <span class="mono">${esc(out.log_file)}</span></span>` : ""}</p>`;
}

// ---------- what Vigil said about an item ----------
const callOf = (x) => x.workflow_status === "reviewed" ? (x.review_priority || "reviewed") : x.workflow_status;
const needsYou = (x) => !!x.manual_review?.needed;  // the pipeline's own rules (app/orchestration/manual_review.py)
const reviewNext = (x) => x.review_priority === "review_next" && x.workflow_status === "reviewed";
const setAside = (x) => x.workflow_status === "reviewed" && ["lower_priority", "insufficient_evidence"].includes(x.review_priority);
const toDecide = (x) => needsYou(x) || reviewNext(x);
// Items Vigil made no call on: the agents did not reach them, or the Reviewer left the dispute open.
const noCall = (x) => ["pending", "not_reviewed", "failed", "unresolved"].includes(x.workflow_status);

// One manual-review reason in the analyst's words, without the internal status names. A drop of 30% or more that leaves
// the PRR above 2 is not a Skeptic challenge (app/agents/skeptic.py), so the reason says so beside "no challenge".
function reasonText(s) {
  if (/^workflow status is unresolved/.test(s)) return "The Reviewer left the dispute unresolved";
  if (/^workflow status is /.test(s)) return "Not reached by the agents in this run";
  s = s.replace(/round skeptic_revision/g, "the revision after the Skeptic").replace(/round skeptic/g, "after the Skeptic's challenge");
  if (/^adjusting for .* by 30% or more$/.test(s)) s += ", though not below 2";
  return capital(s);
}

// Why an item needs a person.
function needReasons(x) {
  const r = (x.manual_review?.needed ? x.manual_review.reasons || [] : []).map(reasonText);
  if (!r.length && reviewNext(x)) r.push("Vigil ranks it review next");
  return r;
}

// The Reviewer gives its strongest objection even when it accepts (app/agents/reviewer.py), so the label says what it then decided.
function objectionBy(x) {
  const last = (x.history || []).at(-1)?.decision;
  return last === "accept" ? "The Reviewer's strongest objection, though it accepted the finding"
    : last === "reject" ? "The Reviewer's objection, with which it rejected the claim"
    : last === "unresolved" ? "The Reviewer's objection; it left the dispute unresolved"
    : "The Reviewer's strongest objection";
}
const objectionHtml = (x) => `<blockquote class="objection"><p>${esc(x.strongest_objection)}</p><cite><span>${objectionBy(x)}</span>${MODEL("Reviewer")}</cite></blockquote>`;

// The Skeptic's outcome in words: "no challenge" only means no co-reported drug takes the PRR below 2.
function skepticOutcome(co) {
  const names = (a) => (a || []).join(", ");
  if (co.outcome === "challenged") return `challenged: adjusting for ${names(co.adjusted_below_threshold)} takes the PRR below 2`;
  if (co.outcome === "no_challenge") return co.attenuated_by?.length
    ? `no challenge, as the PRR stays above 2; adjusting for ${names(co.attenuated_by)} lowers it by 30% or more`
    : "no challenge: the PRR stays above 2 after adjusting for each drug";
  return label(co.outcome);
}

function forLine(x) {
  const p = [], ci = x.uncertainty?.prr_ci95, se = x.seriousness || {};
  const cov = {not_found: "Not found on the label", unclear: "Label coverage unclear",
               covered: `On the label${x.label_section ? ` (${label(x.label_section)})` : ""}`}[x.label_coverage];
  if (cov) p.push(cov);
  if (x.prr != null) p.push(`PRR ${x.prr}${ci ? ` (${ci[0]} to ${ci[1]})` : ""}`);
  if (x.a != null) p.push(`${num(x.a)} reports`);
  if (se.serious_share != null) p.push(`${pct(se.serious_share)} serious`);
  return p.join(" · ");
}

function asideReason(x) {
  if (x.label_coverage === "covered") return `On the label${x.label_section ? `, ${label(x.label_section)}` : ""}${x.label_term ? ` (“${esc(x.label_term)}”)` : ""}`;
  if (x.context === "treated_condition" || x.classification === "likely_indication_or_disease") return "Likely the treated condition or the disease itself";
  if (x.context === "non_clinical" || x.classification === "not_meaningful") return "Not a clinical event";
  if (x.review_priority === "insufficient_evidence") return "Insufficient evidence";
  return capital(label(x.classification));
}

// The strongest reason to doubt an item: a computed flag when there is one, else the Reviewer's (model) objection.
function againstLine(x) {
  if (["pending", "not_reviewed", "failed"].includes(x.workflow_status) && x.status_note) return [capital(esc(firstSentence(x.status_note, 200))), false];
  if (x.reporting_cluster?.needed && x.reporting_cluster.reasons?.length) return [capital(esc(firstSentence(x.reporting_cluster.reasons[0], 200))), false];
  const sk = (x.manual_review?.reasons || []).find((r) => /Skeptic|adjusting for/.test(r));
  if (sk) return [esc(reasonText(sk)), false];
  if (x.uncertainty?.thin_evidence) return [`Thin evidence: ${esc((x.uncertainty.thin_reasons || []).join("; "))}`, false];
  if (x.strongest_objection) return [esc(firstSentence(x.strongest_objection)), true];
  return null;
}

// ---------- the investigation ----------
async function render(res) {
  setLanding(false);
  const out = res.output, d = out.dossier, c = d.counts, data = d.data || {};
  const sm = d.sample_mode, rt = d.run_time || {};
  shown = {res, d};
  seenRun(d.run_id);
  openRows = new Set();
  filter = null;
  const h = [];

  h.push(`<header class="masthead">
    <div class="mast-row"><h1 class="title">${esc(d.drug)}</h1>
      <div class="actions"><button class="btn-plain" id="export">Export queue (CSV)</button><button class="btn-plain" id="dl">Download dossier</button><button class="btn-plain" id="copy-id" title="${esc(d.run_id)}">Copy run ID</button></div></div>
    <div class="facts">
      <span>Investigated <b>${esc(when(d.run_id, true))}</b></span>
      <span>Label effective <b>${esc(fmtDate(data.label_effective))}</b></span>
      <span>FAERS data to <b>${esc(fmtDate(data.data_last_updated))}</b></span>
      <span><b>${num(data.drug_reports)}</b> reports name the drug, of ${num(data.all_reports)}</span>
      <span>${sm ? `Replayed in <b>${num(res.execution_time_seconds ?? rt.seconds)} s</b>` : `Run took <b>${num(rt.seconds ?? res.execution_time_seconds)} s</b> of ${num(rt.budget_seconds)} s`}</span>
    </div></header>`);

  if (sm) h.push(`<p class="notice replay"><b>Recorded replay.</b> The Zetaris results and model replies below are the ones live run <span class="mono">${esc(sm.replayed_from_run)}</span> received on ${esc(fmtTs(sm.recorded_at))}, played back without calling any service.</p>`);
  for (const w of out.nightshift_warnings || []) h.push(`<p class="notice warn"><b>Nightshift setup warning.</b> ${esc(w)}</p>`);
  if ((d.degraded_steps || []).length) h.push(`<p class="notice warn"><b>Degraded steps.</b> ${esc(d.degraded_steps.map((x) => typeof x === "string" ? x : x.step || JSON.stringify(x)).join("; "))}</p>`);
  if ((rt.skipped_for_time || []).length) h.push(`<p class="notice warn"><b>Skipped for time:</b> ${esc(rt.skipped_for_time.join(", "))}</p>`);

  const reviewRounds = (d.rounds || []).filter((r) => typeof r.round === "number").length;
  h.push(`<div class="figures">
      ${fig(num(c.reactions_screened), "Reactions screened", `each with ${num(data.scope?.min_reports ?? 3)} or more reports`)}
      ${fig(num(c.passing_evans), "Pass the PRR screen", "PRR of 2 or more, chi-squared 4 or more")}
      ${fig(num(c.assessed), "Assessed", `${num(c.decided_by_rule)} settled by code rules`)}
      ${fig(num(c.reviewed), "Accepted by the Reviewer", `over ${num(reviewRounds)} review round${reviewRounds === 1 ? "" : "s"}`)}
      ${fig(num(c.review_next), "To review next", c.review_next_check_cluster_first ? `${num(c.review_next_check_cluster_first)} with a reporting cluster to check` : "accepted findings", true)}
    </div>
    <div class="progress" id="progress"></div>`);

  // The queue comes straight after the figures, so its first rows are on the first screen; what changed since the last run follows it.
  h.push(`<section class="section" id="queue-section"><h2>Review queue</h2>
    <p class="sec-lede">Ranked by the pipeline. Open an item for the evidence and the agents' exchange.</p>
    <p class="legend"><span>${COMPUTED} from openFDA data in Zetaris; model claims about it are re-checked in code</span><span><span class="src m">Written by a model</span>: Nemotron Ultra, through Meterless Nightshift; the Analyst's text is checked by the Reviewer</span></p>
    <div class="qbar"><div class="tabs" id="tabs" role="tablist"></div><label class="search-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input class="search" type="search" id="q-search" placeholder="Search reactions" aria-label="Search reactions"></label></div>
    <div class="table-wrap" id="queue-panel" role="tabpanel"><table class="queue" id="queue"></table></div></section>`);

  h.push(sinceLastRun(d));

  // The summary, then how the agents got there, one under the other at every width.
  if (d.analyst_summary) h.push(`<section class="section"><h2>The Analyst's summary</h2><p class="sec-lede">${MODEL("Analyst")} after the last review round.</p><p class="prose summary">${esc(d.analyst_summary)}</p></section>`);
  h.push(`<section class="section"><h2>How the agents got here</h2>
    <p class="sec-lede">The Reviewer's objections go back to the Analyst; the Skeptic's challenges go back to the Reviewer.</p>${proceedings(d)}</section>`);

  h.push(`<section class="section">`);
  h.push(safetyNet(d.safety_net));
  h.push(worldModel(d.world_model));
  const mc = d.model_calls || {};
  h.push(`<details class="appx"><summary><h3>Limits and model calls</h3><span class="tog"></span><p>What this run does not test, and how the model was reached.</p></summary>
    <div class="body"><ul class="list">${(d.untested_factors || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <dl class="facts-list" style="margin-top:16px"><dt>Calls through Meterless Nightshift</dt><dd>${num(mc.total)}</dd><dt>Model</dt><dd class="mono">${esc(res.models?.analyst)}</dd>
      <dt>Served by another model</dt><dd>${num(mc.served_by_other_model)}</dd><dt>With memory injected</dt><dd>${num(mc.with_memory_injected)}</dd>
      <dt>Without a receipt</dt><dd>${num(mc.without_receipt)}</dd><dt>Trace</dt><dd class="mono">${esc(res.log_file)}</dd></dl></div></details>`);
  h.push(`</section><p class="colophon">${esc(d.caveat)}</p>`);

  $("#main").innerHTML = h.join("");
  $("#copy-id").onclick = () => navigator.clipboard?.writeText(d.run_id).then(() => toast("Run ID copied"), () => toast(d.run_id));
  $("#dl").onclick = () => download(`dossier-${d.run_id}.json`, JSON.stringify(d, null, 2), "application/json");
  $("#export").onclick = () => exportCsv();
  qSearch = "";
  $("#q-search").addEventListener("input", (e) => { qSearch = e.target.value.trim().toLowerCase(); renderQueue(); });
  $("#main").onclick = onOpenItem;
  renderQueue();
  drawProgress();
  window.scrollTo({top: 0});
}

function fig(v, k, s, key) { return `<div class="fig${key ? " key" : ""}"><div class="v">${v}</div><div class="k">${esc(k)}</div><div class="s">${esc(s)}</div></div>`; }

function drawProgress() {
  const el = $("#progress");
  if (!el || !shown) return;
  const q = shown.d.review_queue || [], c = shown.d.counts;
  // The run's open questions as figures: what needs the analyst first, then what Vigil left open. A figure with a queue
  // tab of its own opens that tab; a zero is greyed.
  const need = q.filter(toDecide).length;
  const figs = [["needs", need, need === 1 ? "item needs you" : "items need you", "lead"], [null, c.unresolved, "unresolved"],
                ["pending", c.pending, "not reached"], [null, c.skeptic_challenged, "challenged by the Skeptic"]];
  el.innerHTML = figs.map(([tab, n, what, cls = ""]) => {
    const go = tab && TABS.some(([k, , f]) => k === tab && q.some(f)) && n;
    const inner = `<b>${num(n)}</b><span>${what}</span>${go ? CHEV : ""}`;
    return go ? `<button type="button" class="pg ${cls}" data-go="${tab}" title="Show them in the queue">${inner}</button>`
              : `<span class="pg ${cls}${n ? "" : " zero"}">${inner}</span>`;
  }).join("");
  el.onclick = (e) => {
    const b = e.target.closest("[data-go]");
    if (!b) return;
    filter = b.dataset.go; renderQueue();
    $(".qbar")?.scrollIntoView({behavior: "smooth", block: "start"});
  };
}

function sinceLastRun(d) {
  const s = d.world_model?.since_last_run;
  if (!s?.compared_with_runs?.length) return "";
  const q = d.review_queue || [];
  const by = (st) => q.filter((x) => x.since_last_run?.status === st);
  const item = (x, extra) => `<li><button class="link" data-open="${esc(x.reaction)}">${esc(x.reaction)}</button>${extra ? ` <span class="muted">${extra}</span>` : ""}</li>`;
  const changed = by("changed").map((x) => item(x, (x.since_last_run.changed || []).map((c) => `${label(c.field)} ${label(c.earlier)} → ${label(c.now)}`).join("; ")));
  const rows = [];
  if (changed.length) rows.push(["Changed verdicts", changed.join("")]);
  if (by("new").length) rows.push(["New this run", by("new").map((x) => item(x)).join("")]);
  if (by("not_settled_now").length) rows.push(["Settled before, not now", by("not_settled_now").map((x) => item(x, `was ${label(x.since_last_run.earlier?.review_priority)}`)).join("")]);
  const missing = s.earlier_review_next_not_assessed || [];
  if (missing.length) rows.push(["Review next before, not assessed now", missing.map((m) => `<li>${esc(m.reaction)} <span class="muted">run ${esc(m.earlier_run)}</span></li>`).join("")]);
  if (!rows.length) return "";
  const prev = s.previous_label_version?.effective_time, now = d.world_model?.label_version?.effective_time;
  return `<section class="section since"><h2>Since the last run</h2>
    <p class="sec-lede">${COMPUTED} by the World Model, against ${num(s.compared_with_runs.length)} earlier run${s.compared_with_runs.length === 1 ? "" : "s"} of ${esc(d.drug)}.
      ${s.label_version_changed ? `<b>The label changed</b> from ${esc(fmtDate(prev))} to ${esc(fmtDate(now))}, which reopens earlier verdicts.` : "The label is the same version."}</p>
    <div class="changes">${rows.map(([k, v]) => `<div><span class="k">${k}</span><ul>${v}</ul></div>`).join("")}</div></section>`;
}

function proceedings(d) {
  const c = d.counts, rows = [];
  rows.push(["data_clerk", "Data Clerk", `Registered the openFDA counts and the current label in Zetaris; ${num(c.passing_evans)} of ${num(c.reactions_screened)} reactions pass the screen.`]);
  rows.push(["analyst", "Analyst", `Shown the ${num(c.shown_to_analyst)} strongest, picked ${num(c.picked_by_analyst)}; ${num(c.decided_by_rule)} settled by code rules.`]);
  for (const r of d.rounds || []) {
    if (r.round === "skeptic") rows.push(["skeptic", "Skeptic", `Checked ${num(r.checked)} against co-reported drugs; ${num(r.challenged)} challenged, ${num(r.priority_changed)} changed priority.`]);
    else rows.push(["reviewer", `Reviewer, round ${r.round}`, `${num(r.reviewed)} accepted, ${num(r.rejected)} rejected, ${num(r.unresolved)} unresolved${r.missing ? `; named ${num(r.missing)} more to assess` : ""}.`]);
  }
  rows.push(["world_model", "World Model", `${num(d.world_model?.decisions_recorded)} verdicts recorded against this label version; ${num((d.world_model?.reopened || []).length)} reopened.`]);
  return `<ol class="proc with-crew">${rows.map(([k, w, t]) => `<li><span class="who">${sprite(k)}${esc(w)}</span><span class="what">${esc(t)}</span></li>`).join("")}</ol>`;
}

// ---------- queue ----------
const TABS = [
  ["needs", "Needs you", toDecide],
  ["review_next", "Review next", reviewNext],
  ["aside", "Set aside by Vigil", setAside],
  ["pending", "Not reached", (q) => ["pending", "not_reviewed", "failed"].includes(q.workflow_status)],
  ["all", "All", () => true],
];

function renderQueue() {
  if (!shown) return;
  const d = shown.d, q = d.review_queue || [];
  if (!filter || !TABS.some(([k, , f]) => k === filter && q.some(f))) filter = (TABS.find(([, , f]) => q.some(f)) || TABS[4])[0];
  $("#tabs").innerHTML = TABS.map(([k, name, f]) => `<button class="tab${k === "needs" ? " needs" : ""}" role="tab" id="tab-${k}" aria-controls="queue-panel" aria-selected="${k === filter}" tabindex="${k === filter ? 0 : -1}" data-tab="${k}">${name}<span class="c">${q.filter(f).length}</span></button>`).join("");
  $("#queue-panel").setAttribute("aria-labelledby", `tab-${filter}`);
  $("#tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { filter = b.dataset.tab; renderQueue(); } };
  // Arrow keys move between tabs, as in any tab list.
  $("#tabs").onkeydown = (e) => {
    const step = {ArrowRight: 1, ArrowLeft: -1}[e.key];
    if (!step) return;
    e.preventDefault();
    filter = TABS[(TABS.findIndex(([k]) => k === filter) + step + TABS.length) % TABS.length][0];
    renderQueue();
    $(`#tab-${filter}`).focus();
  };
  const rows = visibleRows();
  const hi = Math.max(4, ...rows.map(([x]) => x.uncertainty?.prr_ci95?.[1] ?? x.prr ?? 0));
  $("#queue").innerHTML = `<thead><tr><th class="tw"></th><th class="rank">No.</th><th>Reaction</th><th>Vigil's call</th><th class="r hide-sm">Reports</th><th class="r">PRR, 95% CI</th></tr></thead>
    <tbody>${rows.map(([x, i]) => queueRow(x, i, hi) + (openRows.has(i) ? detailRow(x, i) : "")).join("") || `<tr><td colspan="6" class="empty" style="padding:24px 10px">Nothing in this view.</td></tr>`}</tbody>`;
  $("#queue").onclick = onQueueClick;
}

// The current tab's items, in queue order, as [item, queue index].
function visibleRows() {
  const f = TABS.find(([k]) => k === filter)[2];
  return (shown.d.review_queue || []).map((x, i) => [x, i]).filter(([x]) => f(x) && (!qSearch || (x.reaction || "").toLowerCase().includes(qSearch)));
}

// One item is open at a time: opening an item closes the one before.
function toggle(tr) {
  const i = +tr.dataset.i, d = shown.d;
  const mark = (row, open) => { row.classList.toggle("open", open); $(".rowbtn", row).setAttribute("aria-expanded", String(open)); };
  if (openRows.has(i)) {
    openRows.delete(i);
    if (tr.nextElementSibling?.classList.contains("detail")) tr.nextElementSibling.remove();
    mark(tr, false);
    return;
  }
  openRows.clear();
  $("#queue").querySelectorAll("tr.detail").forEach((el) => el.remove());
  $("#queue").querySelectorAll("tr.row.open").forEach((el) => mark(el, false));
  openRows.add(i);
  mark(tr, true);
  tr.insertAdjacentHTML("afterend", detailRow(d.review_queue[i], i));
}

function onQueueClick(e) {
  const qb = e.target.closest("[data-q]");
  if (qb) return showQuery(qb);
  const tab = e.target.closest(".dtab");
  if (tab) return showTab(tab.closest(".doc"), tab.dataset.tab);
  if (e.target.closest("tr.detail")) return;
  const tr = e.target.closest("tr.row");
  if (tr) toggle(tr);
}

// "Since the last run" links: show the item in the All tab, opened.
function onOpenItem(e) {
  const b = e.target.closest("[data-open]");
  if (!b || !shown) return;
  const i = shown.d.review_queue.findIndex((x) => x.reaction === b.dataset.open);
  if (i < 0) return;
  filter = "all"; qSearch = ""; $("#q-search").value = "";
  openRows = new Set([i]);
  renderQueue();
  $(`#queue tr.row[data-i="${i}"]`)?.scrollIntoView({behavior: "smooth", block: "start"});
}

function forest(x, hi, w = 110) {
  const ci = x.uncertainty?.prr_ci95;
  if (x.prr == null) return "";
  const at = (v) => Math.log(Math.max(v, 1)) / Math.log(hi) * (w - 6) + 3;
  return `<svg width="${w}" height="14" viewBox="0 0 ${w} 14" aria-hidden="true">
    <line x1="3" x2="${w - 3}" y1="7" y2="7" stroke="var(--rule-strong)" stroke-width="1"/>
    <line x1="${at(2)}" x2="${at(2)}" y1="2" y2="12" stroke="var(--muted)" stroke-width="1"><title>PRR 2, the screen's threshold</title></line>
    ${ci ? `<line x1="${at(ci[0])}" x2="${at(ci[1])}" y1="7" y2="7" stroke="var(--ink)" stroke-width="1.5"/>
            <line x1="${at(ci[0])}" x2="${at(ci[0])}" y1="4" y2="10" stroke="var(--ink)" stroke-width="1.5"/>
            <line x1="${at(ci[1])}" x2="${at(ci[1])}" y1="4" y2="10" stroke="var(--ink)" stroke-width="1.5"/>` : ""}
    <rect x="${at(x.prr) - 3}" y="4" width="6" height="6" fill="var(--ink)"/></svg>`;
}

function queueRow(x, i, hi) {
  const ci = x.uncertainty?.prr_ci95, call = callOf(x);
  return `<tr class="row${openRows.has(i) ? " open" : ""}" data-i="${i}">
    <td class="tw">${CHEV}</td>
    <td class="rank">${String(i + 1).padStart(2, "0")}</td>
    <td class="rx"><button type="button" class="rowbtn" aria-expanded="${openRows.has(i)}" aria-controls="detail-${i}">${esc(x.reaction)}</button>${x.context && x.context !== "clinical_event" ? `<span class="ctx">${capital(label(x.context))}</span>` : ""}<div class="why">${whyLines(x).join("")}</div></td>
    <td class="callc"><span class="call"><span class="st ${esc(call)}">${capital(label(call))}</span>${x.label_coverage ? `<small class="cov ${esc(x.label_coverage)}">Label: ${label(x.label_coverage)}</small>` : ""}</span></td>
    <td class="r hide-sm">${num(x.a)}</td>
    <td class="r prrc"><div class="forest" title="${ci ? `95% CI ${ci[0]} to ${ci[1]}` : ""}">${forest(x, hi)}<span class="v">${x.prr ?? "–"}</span></div></td></tr>`;
}

// An item's case in brief: why it was set aside or needs you, the figures for it, and the strongest reason to doubt it.
function whyLines(x) {
  const lines = [];
  if (setAside(x)) lines.push(`<div class="aside"><span class="lbl">Set aside</span><span class="t">${asideReason(x)}</span></div>`);
  const fl = forLine(x);
  if (fl) lines.push(`<div><span class="lbl">${setAside(x) ? "Figures" : "For"}</span><span>${fl}</span></div>`);
  const ag = setAside(x) ? null : againstLine(x);
  // An item the agents did not reach has its status here, not a reason against it.
  const notReached = ["pending", "not_reviewed", "failed"].includes(x.workflow_status) && x.status_note;
  if (ag) lines.push(`<div class="against"><span class="lbl">${notReached ? "Status" : "Against"}</span><span class="t${ag[1] ? " model-text" : ""}" ${ag[1] ? 'title="The Reviewer\'s objection, written by a model"' : ""}>${ag[0]}</span></div>`);
  // Why it needs you, unless the line above already says it or the call column does ("review next", "pending").
  const need = toDecide(x) ? needReasons(x).filter((r) => esc(r) !== ag?.[0] && r !== "Vigil ranks it review next"
                                                         && !(notReached && r === "Not reached by the agents in this run")) : [];
  if (need.length) lines.splice(setAside(x) ? 1 : 0, 0, `<div class="need"><span class="lbl">Needs you</span><span class="t">${esc(need[0])}${need.length > 1 ? ` <span class="more">+${need.length - 1} more</span>` : ""}</span></div>`);
  return lines;
}

// The Analyst's claims and the Reviewer's verdicts on an item, round by round.
function threadHtml(x) {
  return (x.history || []).map((h) => `<li><span class="who"><b>${esc(roundName(h.round))}</b>Analyst, then Reviewer</span>
      <div class="said"><div>Claimed: ${label(h.claim?.label_coverage)} on the label, ${label(h.claim?.context)}, ${label(h.claim?.review_priority)}.</div>
      <div><span class="verdict ${esc(h.decision)}">${capital(label(h.decision))}.</span> <span class="model-text">${esc(h.reason)}</span></div>
      ${h.objection && h.objection !== x.strongest_objection ? `<div><i>Objection:</i> <span class="model-text">${esc(h.objection)}</span></div>` : ""}</div></li>`).join("");
}

function detailRow(x, i) { return `<tr class="detail" id="detail-${i}"><td colspan="6">${detail(x, i, shown.d)}</td></tr>`; }

function roundName(r) {
  return typeof r === "number" ? `Round ${r}` : r === "skeptic" ? "After the Skeptic's challenge" : r === "skeptic_revision" ? "Revision after the challenge" : capital(label(r));
}

function qid(d, prefix) {
  return Object.entries(d.evidence_queries || {}).find(([, v]) => (v.purpose || "").startsWith(prefix))?.[0];
}
// A link to the Zetaris queries behind a block, named for what it opens rather than by the queries' IDs.
const qlinks = (i, ids) => {
  ids = [...new Set(ids.filter(Boolean))];
  return ids.length ? `<button class="link qlink" data-q="${esc(ids.join(" "))}" data-i="${i}" title="${esc(ids.join(", "))}">${ids.length === 1 ? "Its SQL" : `Its ${ids.length} SQL queries`}</button>` : "";
};

function showTab(doc, key) {
  doc.querySelectorAll(".dtab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === key)));
  doc.querySelectorAll(".dpanel").forEach((p) => { p.hidden = p.dataset.panel !== key; });
}

// An SQL link opens what hides its queries first: their tab, or the folds around them.
function showQuery(btn) {
  const dets = btn.dataset.q.split(" ").map((q) => document.getElementById(`ev-${btn.dataset.i}-${q}`)).filter(Boolean);
  if (!dets.length) return;
  const panel = dets[0].closest(".dpanel");
  if (panel) showTab(panel.closest(".doc"), panel.dataset.panel);
  for (let f = dets[0].parentElement.closest("details"); f; f = f.parentElement.closest("details")) f.open = true;
  for (const det of dets) {
    det.open = true;
    det.classList.add("flash");
    setTimeout(() => det.classList.remove("flash"), 1600);
  }
  dets[0].scrollIntoView({behavior: "smooth", block: "center"});
}

// An open item: what stays in view (status, the strongest objection, why it needs you, the key figures), then one tab
// at a time. A tab's note gives its outcome in a line where it has one; its aside carries the source marks and SQL links.
function detail(x, i, d) {
  // Reading order: why it is here and the strongest doubt, then the evidence.
  const head = [], tabs = [];
  const tab = (key, name, body, aside = "", note = "") => tabs.push({key, name, body, aside, note});
  if (x.status_note) head.push(`<p class="statusline">${esc(capital(x.status_note))}</p>`);
  if (x.strongest_objection) head.push(objectionHtml(x));
  const need = toDecide(x) ? needReasons(x) : [];
  if (need.length) head.push(`<div class="needs"><h3>Why it needs you</h3><ul>${need.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>`);

  const why = [];
  if (x.reasoning) why.push(`<p class="reading">${esc(x.reasoning)}</p>`);
  if (x.next_check) why.push(`<p class="reading"><b>Next check.</b> ${esc(x.next_check)}</p>`);
  tab("assess", "Assessment", why.join("") || `<p class="muted small">No assessment.</p>`,
    (x.classification ? `<span>${capital(label(x.classification))}${x.decided_by ? `, by ${label(x.decided_by)}` : ""}</span>` : "") + (x.decided_by === "rule" ? COMPUTED : MODEL("Analyst")));

  const thread = threadHtml(x);
  tab("exchange", "Exchange", thread ? `<ol class="thread">${thread}</ol>` : (x.reviewer ? `<p class="small">${esc(x.reviewer)}</p>` : `<p class="muted small">Not reviewed.</p>`),
    thread ? MODEL("Reviewer") : "");

  const src = [];
  if (x.report_sources?.summary) src.push(`<p class="small">${esc(x.report_sources.summary)}</p>`);
  // The cluster's reasons repeat the country shares the summary above already gives, so only its note and meaning follow.
  const rc = x.reporting_cluster;
  if (rc?.needed) src.push(`<div class="cluster"><b>${esc(capital(rc.note))}.</b> ${x.report_sources?.summary ? "" : `${esc(capital((rc.reasons || []).join("; ")))}. `}${esc(rc.why)}</div>`);
  if (src.length) tab("reporters", "Reporters", src.join(""), COMPUTED + qlinks(i, x.report_sources?.query_ids || []));

  const co = x.co_reported_drugs;
  if (co) {
    const pairs = (co.pairs || []).map((p) => `<tr><td style="text-transform:capitalize">${esc(p.co_drug)}</td><td class="r">${pct(p.share)}</td><td class="r">${p.co_drug_prr ?? "–"}</td><td class="r"><b>${p.adjusted_prr ?? "–"}</b></td><td>${p.possible_interaction ? "possible" : "–"}</td></tr>`).join("");
    tab("skeptic", "Skeptic", `${pairs ? `<div class="table-wrap"><table class="small-table"><thead><tr><th>Co-reported drug</th><th class="r">On reports</th><th class="r">Its own PRR</th><th class="r">PRR adjusted for it</th><th>Interaction</th></tr></thead><tbody>${pairs}</tbody></table></div>` : ""}
      <details class="sub"><summary>The Skeptic's working</summary><p class="small" style="margin-top:6px">${esc(co.summary)}</p></details>`, COMPUTED,
      capital(skepticOutcome(co)));
  }

  const lab = [];
  if (x.label_quote) lab.push(`<p class="quote">“${esc(x.label_quote)}”</p><p class="quote-src">${capital(label(x.label_section))}, matched on “${esc(x.label_term)}”. The quote is taken from the label text by code.</p>`);
  else if (x.label_search?.summary) lab.push(`<p class="small">${esc(x.label_search.summary)}</p>`);
  tab("label", "Label", lab.join("") || `<p class="muted small">No label search recorded.</p>`, COMPUTED + qlinks(i, [qid(d, "label text")]),
    x.label_coverage ? capital(label(x.label_coverage)) : "");

  const u = x.uncertainty || {}, se = x.seriousness || {};
  // The figures in three groups, each a short ruled list: the screen's own numbers (with the PRR's CI drawn against the
  // threshold), the information component, and seriousness. A thin-evidence warning follows them.
  const fgroup = (title, rows, foot = "") => `<section class="fgroup"><h4>${title}</h4><dl>${rows.map(([k, v, t]) =>
    `<div><dt${t ? ` title="${t}"` : ""}>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>${foot}</section>`;
  const fci = u.prr_ci95;
  tab("numbers", "Figures", `<div class="figs">
    ${fgroup("Disproportionality", [["Reports with the drug", num(x.a)], ["Expected", num(u.expected)],
      ["PRR", `<b>${x.prr ?? "–"}</b>`, "Proportional reporting ratio"], ["95% CI", fci ? `${fci[0]} to ${fci[1]}` : "–"], ["Chi-squared", num(x.chi2)]],
      x.prr != null ? `<div class="fplot">${forest(x, Math.max(4, fci?.[1] ?? x.prr), 200)}<small>The tick is the screen's threshold, PRR 2</small></div>` : "")}
    ${fgroup("Information component", [["IC", u.ic ?? "–"], ["IC, lower 95% bound", u.ic025 ?? "–"]],
      `<p class="fnote">Log2 of observed over expected reports. A lower bound above 0 means more reports than expected, allowing for chance.</p>`)}
    ${fgroup("Seriousness", [["Serious", `${num(se.serious)} <small>${pct(se.serious_share)}</small>`], ["Fatal", `${num(se.death)} <small>${pct(se.death_share)}</small>`]])}
    </div>${u.thin_evidence ? `<p class="fwarn"><b>Thin evidence.</b> ${esc(capital((u.thin_reasons || []).join("; ")))}</p>` : ""}`,
    COMPUTED + qlinks(i, [qid(d, "disproportionality screen"), d.data?.seriousness_query]));

  const url = shown.res.output.case_reports?.[x.reaction];
  if (url) tab("cases", "Case reports", `<p class="cases"><a href="${esc(url)}" target="_blank" rel="noopener">Open the matching FAERS reports on openFDA</a></p>
    <p class="small muted">The first 10 reports, as openFDA's JSON. Its <span class="mono">meta.results.total</span> is the number of matching reports, which can differ slightly from the count above as openFDA updates.</p>`);

  const sl = x.since_last_run;
  if (sl) tab("since", "Since last run", `<p class="small">${esc(sl.why)}</p>${(sl.changed || []).length ? `<ul class="list">${sl.changed.map((c) => `<li>${capital(label(c.field))}: ${label(c.earlier)} → <b>${label(c.now)}</b></li>`).join("")}</ul>` : ""}`, COMPUTED,
    capital(label(sl.status)));

  const ids = [...new Set([...(x.evidence || []), qid(d, "disproportionality screen"), d.data?.seriousness_query, qid(d, "label text"),
                           ...(x.report_sources?.query_ids || []), ...(co?.query_ids || [])].filter(Boolean))];
  if (ids.length) {
    const eq = d.evidence_queries || {};
    tab("sql", "SQL", `<div class="queries">${ids.map((id) => eq[id]
      ? `<details id="ev-${i}-${esc(id)}"><summary><span class="mono">${esc(id)}</span><span>${esc(capital(eq[id].purpose))}</span></summary><pre>${esc(eq[id].sql)}</pre></details>`
      : `<div class="mono muted" style="padding:6px 0">${esc(id)}</div>`).join("")}</div>`, "", `${ids.length} Zetaris queries`);
  }

  const ci = u.prr_ci95, stats = [
    ["PRR", x.prr != null ? `<b>${x.prr}</b>${ci ? `<small>95% CI ${ci[0]} to ${ci[1]}</small>` : ""}` : "–"],
    ["Reports", `<b>${num(x.a)}</b><small>${num(u.expected)} expected</small>`],
    ["Serious", `<b>${pct(se.serious_share)}</b><small>${num(se.serious)} reports</small>`],
    ["Fatal", `<b>${pct(se.death_share)}</b><small>${num(se.death)} reports</small>`],
    ["Label", `<b class="cov ${esc(x.label_coverage || "")}">${capital(label(x.label_coverage))}</b>${x.label_section ? `<small>${capital(label(x.label_section))}</small>` : ""}`]];
  return `<div class="doc">${head.join("")}<dl class="dstats">${stats.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <div class="dtabs" role="tablist">${tabs.map((t, j) => `<button type="button" role="tab" class="dtab" data-tab="${t.key}" aria-selected="${j === 0}">${t.name}</button>`).join("")}</div>
    ${tabs.map((t, j) => `<section class="dpanel" data-panel="${t.key}" role="tabpanel"${j ? " hidden" : ""}>
      ${t.note || t.aside ? `<div class="dhead">${t.note ? `<p class="dnote">${t.note}</p>` : ""}<span class="aside">${t.aside}</span></div>` : ""}${t.body}</section>`).join("")}</div>`;
}




// ---------- export ----------
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = Object.assign(document.createElement("a"), {href: url, download: name});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCsv() {
  if (!shown) return;
  const d = shown.d, cases = shown.res.output.case_reports || {};
  const cols = ["run_id", "drug", "label_effective", "faers_data_to", "replay_of", "rank", "reaction", "vigil_call", "label_coverage", "context",
                "classification", "decided_by", "reports", "prr", "prr_ci_low", "prr_ci_high", "serious_share", "needs_you_reasons",
                "reporting_cluster", "skeptic_outcome", "strongest_objection", "analyst_reasoning", "next_check",
                "zetaris_queries", "openfda_reports"];
  const rows = (d.review_queue || []).map((x, i) => {
    const ci = x.uncertainty?.prr_ci95 || [];
    return [d.run_id, d.drug, d.data?.label_effective, d.data?.data_last_updated, d.sample_mode?.replayed_from_run, i + 1, x.reaction,
            callOf(x), x.label_coverage, x.context, x.classification, x.decided_by, x.a, x.prr, ci[0], ci[1], x.seriousness?.serious_share,
            (x.manual_review?.reasons || []).join("; "), (x.reporting_cluster?.needed ? (x.reporting_cluster.reasons || []).join("; ") : ""),
            x.co_reported_drugs?.outcome, x.strongest_objection, x.reasoning, x.next_check,
            (x.evidence || []).join(" "), cases[x.reaction]];
  });
  const cell = (v) => { v = v == null ? "" : String(v); return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = "﻿" + [cols, ...rows].map((r) => r.map(cell).join(",")).join("\r\n");
  download(`vigil-${d.drug}-${d.run_id}-queue.csv`, csv, "text/csv;charset=utf-8");
  toast(`Exported ${rows.length} items`);
}

// ---------- appendices ----------
function safetyNet(sn) {
  if (!sn || sn.status !== "done") return "";
  const top = sn.summary?.top_not_mentioned || [];
  const lists = [["designated_medical_events", "Designated medical events"], ["missed_serious_terms", "Serious terms outside the screen"], ["pregnancy_and_newborn", "Pregnancy and newborn"]];
  const table = (rows) => `<div class="table-wrap"><table class="small-table"><thead><tr><th>Reaction</th><th class="r">Reports</th><th class="r">Serious</th><th>Label</th><th>Screen</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.reaction)}</td><td class="r">${num(r.reports)}</td><td class="r">${num(r.serious_reports)}</td><td title="${esc(r.label_detail)}">${label(r.label_status)}</td><td title="${esc(r.screen_detail)}">${label(r.screen_status)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<details class="appx"><summary><h3>Safety net: ${num(sn.summary?.terms)} terms outside the screen</h3><span class="tog"></span><p>${esc(sn.note)}</p></summary>
    <div class="body"><p class="small" style="max-width:760px">${esc(sn.summary?.text)}</p>
    ${top.length ? `<div class="table-wrap"><table class="small-table" style="max-width:760px"><thead><tr><th>Not found on the label</th><th>List</th><th class="r">Reports</th><th class="r">Serious</th></tr></thead><tbody>${top.map((r) => `<tr><td>${esc(r.reaction)}</td><td class="muted">${label(r.section)}</td><td class="r">${num(r.reports)}</td><td class="r">${num(r.serious_reports)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${lists.map(([k, name]) => (sn[k] || []).length ? `<details class="sub"><summary>${esc(name)} (${sn[k].length})</summary>${table(sn[k])}</details>` : "").join("")}
    ${(sn.limits || []).length ? `<details class="sub"><summary>Limits of this list</summary><ul class="list" style="margin-top:8px">${sn.limits.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></details>` : ""}</div></details>`;
}

function worldModel(wm) {
  if (!wm) return "";
  const s = wm.since_last_run || {}, reopened = wm.reopened || [];
  return `<details class="appx"><summary><h3>World Model: verdicts across runs</h3><span class="tog"></span><p>The Meterless World Model engine keeps each settled verdict with the label version it rests on, and reopens it when that label changes.</p></summary>
    <div class="body">
      <p class="ledger"><span><b>${num(wm.decisions_recorded)}</b> recorded</span><span><b>${num(reopened.length)}</b> reopened</span>
        ${s.compared_with_runs ? `<span><b>${num(s.new)}</b> new</span><span><b>${num(s.unchanged)}</b> unchanged</span><span><b>${num(s.changed)}</b> changed</span><span><b>${num(s.not_settled_now)}</b> not settled now</span>` : ""}</p>
      <p class="small">Recorded against the label effective ${esc(fmtDate(wm.label_version?.effective_time))}.
      ${s.compared_with_runs ? `Compared with ${num(s.compared_with_runs.length)} earlier run${s.compared_with_runs.length === 1 ? "" : "s"} of this drug.` : "No earlier verdicts for this drug."}
      ${s.label_version_changed ? " <b>The label version changed since the last run.</b>" : ""}</p>
      ${reopened.length ? `<p class="small"><b>Reopened because the label changed:</b> ${reopened.map((r) => esc(r.reaction || r)).join(", ")}</p>` : ""}
      ${wm.read_by ? `<details class="sub"><summary>How earlier verdicts are used</summary><p class="small" style="margin-top:6px">${esc(wm.read_by.code)}</p><p class="small">${esc(wm.read_by.agent_prompts)}</p></details>` : ""}
    </div></details>`;
}

// ---------- landing ----------
// The landing page: what Vigil does, shown with real pieces of the newest finished investigation (never made-up figures),
// and the drug form as its one action. With no finished investigation yet, the pieces are left out.
function setLanding(on) { $(".layout").classList.toggle("landing-mode", on); document.body.classList.toggle("landing", on); }

// The item the landing page shows: the newest finished run's first review-next item that went through review, else its first item that needs you.
// Before this machine has finished any run, the item comes from GET /example: a replay of a recorded live run that the
// server makes once, outside the run list (example is then true).
async function landingItem() {
  const run = runs.find((r) => r.status === "success" && !r.sample_mode) || runs.find((r) => r.status === "success");
  const [status, out] = await api(run ? `/runs/${encodeURIComponent(run.run_id)}` : "/example");
  const d = out.output?.dossier;
  if (status !== 200 || !d?.review_queue?.length) return null;
  const q = d.review_queue;
  let i = q.findIndex((x) => reviewNext(x) && x.history?.length && x.uncertainty?.prr_ci95);
  if (i < 0) i = Math.max(0, q.findIndex(toDecide));
  return {d, x: q[i], i, example: !run};
}

async function intro() {
  setLanding(true);
  setSide(false);
  const samples = health?.samples || [];
  const live = !sampleMode;
  $("#main").innerHTML = `<div class="lp">
    <section class="lp-hero">
      <div class="lp-hero-text">
        <h1>Drug reactions worth a closer look</h1>
        <p class="lp-lead">Give Vigil a drug. It screens every reaction reported with it in openFDA's adverse-event data, has agents argue
          over the strongest, and hands you a ranked queue with the evidence and the objections behind each item.</p>
        <form class="lp-form" id="hero-form" autocomplete="off">
          <label class="field-label" for="hero-drug">Drug, by generic name</label>
          <div class="lp-form-row"><input class="input" type="text" id="hero-drug" placeholder="E.g. montelukast" list="samples" required spellcheck="false">
            <button class="lp-go" type="submit"${health?.busy ? " disabled" : ""}>${live ? "Start investigation" : "Replay investigation"}</button></div>
          <p class="hint">${health?.busy ? "An investigation is running; one at a time." : live ? "About 5 to 10 minutes: openFDA data is registered in Zetaris and the agents run on Nemotron through Nightshift."
            : "Replays a recorded live run in a few seconds, with no Zetaris, Nightshift or network."}</p>
          ${samples.length ? `<p class="quick lp-samples">Recorded replays: ${samples.map((x) => `<button type="button" data-drug="${esc(x)}">${esc(x)}</button>`).join(", ")}</p>` : ""}
        </form>
      </div>
      <div class="lp-hero-fig" id="lp-hero-fig"></div>
    </section>
    <div id="lp-proof"></div>
    <footer class="lp-close"><div class="lp-sign" aria-hidden="true"><p class="lp-word">Vigil</p>
      <div class="lp-crew">${["orchestrator", "data_clerk", "analyst", "reviewer", "skeptic"].map((k, i) => idle(k, i * 3)).join("")}</div></div>
      <p>Drug reaction review. Counts and labels from openFDA FAERS, registered in Zetaris; the Analyst and Reviewer run on Nemotron Ultra
        through Meterless Nightshift.</p>
      <p>FAERS reports show an association between a drug and a reported event, not that the drug caused it. This is not medical advice.</p></footer>
  </div>`;
  const lp = $(".lp");
  $("#hero-form").addEventListener("submit", (e) => {
    e.preventDefault();
    $("#drug").value = $("#hero-drug").value.trim();
    $("#run-form").requestSubmit();
  });
  lp.addEventListener("click", (e) => {
    const s = e.target.closest(".lp-samples [data-drug]");
    if (s) { $("#hero-drug").value = s.dataset.drug; $("#hero-drug").focus(); return; }
    const r = e.target.closest("[data-run]");
    if (r) return openRun(r.dataset.run);
  });

  const got = await landingItem();
  if (!got || lp !== $(".lp")) return;  // nothing finished yet, or the visitor has already moved on
  const {d, x, i, example} = got, ci = x.uncertainty?.prr_ci95, u = x.uncertainty || {}, se = x.seriousness || {};
  const hi = Math.max(4, ci?.[1] ?? x.prr ?? 0);
  const from = example
    ? "An example result. Your own results appear here once you run an investigation."
    : `Item ${i + 1} of the <b>${esc(d.drug)}</b> investigation, ${esc(when(d.run_id))}${d.sample_mode ? " (replay)" : ""}.
    <button type="button" class="link" data-run="${esc(d.run_id)}">Open it</button>`;
  $("#lp-hero-fig").innerHTML = `<figure class="lp-stage">
      <div class="lp-frag lp-item" data-ui>
        <div class="lp-item-head"><span class="name">${esc(x.reaction)}</span><span class="st ${esc(callOf(x))}">${capital(label(callOf(x)))}</span></div>
        <div class="why">${whyLines(x).join("")}</div>
        ${x.prr != null ? `<div class="lp-item-foot"><span class="forest">${forest(x, hi, 220)}<span class="v">${x.prr}</span></span>
          <span class="muted">PRR${ci ? `, 95% CI ${ci[0]} to ${ci[1]}` : ""}; the tick is the screen's threshold, PRR 2</span></div>` : ""}
      </div>
      <figcaption>${from}</figcaption></figure>`;
  if (example) return;  // the sections below show this machine's own runs, never the example

  const rows = [];
  rows.push(`<section class="lp-row"><div class="lp-say"><h2>Numbers from SQL, not from a model</h2>
      <p>The Data Clerk registers the openFDA counts and the drug's current label in Zetaris and runs the disproportionality screen there, in SQL.
        When a model cites a count, a PRR or a label quote, the Reviewer re-checks it in code before it reaches you.</p></div>
    <figure class="lp-stage lp-narrow"><div class="lp-frag" data-ui>
      <div class="lp-frag-title"><span>Disproportionality, ${esc(x.reaction.toLowerCase())}</span>${COMPUTED}</div>
      <dl class="facts-list"><dt>Reports with the drug</dt><dd>${num(x.a)}</dd><dt>Expected</dt><dd>${num(u.expected)}</dd>
        <dt>PRR</dt><dd><b>${x.prr ?? "–"}</b>${ci ? `, 95% CI ${ci[0]} to ${ci[1]}` : ""}</dd><dt>Chi-squared</dt><dd>${num(x.chi2)}</dd>
        <dt>Serious</dt><dd>${num(se.serious)} (${pct(se.serious_share)})</dd>
        <dt>Label</dt><dd>${capital(label(x.label_coverage))}${x.label_section ? `, ${label(x.label_section)}` : ""}</dd></dl>
      ${x.label_quote ? `<p class="quote">“${esc(x.label_quote)}”</p>` : ""}</div>
    <figcaption>Item ${i + 1}, as the Reviewer's code sees it.</figcaption></figure></section>`);

  const thread = threadHtml(x);
  if (thread || x.strongest_objection) rows.push(`<section class="lp-row"><div class="lp-say"><h2>The agents argue before you see it</h2>
      <p>The Analyst classifies the strongest reactions against the label. The Reviewer accepts, objects or leaves a claim unresolved,
        and objections go back for another round. The Skeptic tests review-next findings against co-reported drugs.</p></div>
    <figure class="lp-stage"><div class="lp-frag" data-ui>
      ${x.strongest_objection ? objectionHtml(x) : ""}
      ${thread ? `<ol class="thread">${thread}</ol>` : ""}</div>
    <figcaption>Item ${i + 1}: the Reviewer's objection and each round of the exchange.</figcaption></figure></section>`);

  $("#lp-proof").innerHTML = rows.join("");

  // Each section rises in as it scrolls into view; without the observer, or with reduced motion, everything is simply shown.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("seen"); io.unobserve(e.target); } }), {rootMargin: "0px 0px -12% 0px"});
    lp.querySelectorAll(".lp-row").forEach((el) => { el.classList.add("rise"); io.observe(el); });
  }
}

// Back to the address without a run ID shows the landing page, not the last investigation under it.
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== current) openRun(id); else if (!id && current) goHome(); });

(async () => {
  if (location.hash.length > 1) setLanding(false);  // before any request, so the layout never changes under the visitor
  await Promise.all([loadHealth(), loadRuns()]);
  const id = location.hash.slice(1);
  if (id) openRun(id);
  else if (health?.busy) { current = health.current_run; follow(current, null); }
  else intro();
})();
</script>
